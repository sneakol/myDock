name: Release

# Push a tag like v1.0.0 (it must match <Version> in Directory.Build.props) to publish a GitHub release with the .deb packages.
# "Run workflow" from the Actions tab builds and tests the packages without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # Only the repository owner can build or publish packages.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version $version in Directory.Build.props" >&2
            exit 1
          fi

      - name: Test
        run: dotnet test tests/MyDock.Core.Tests -c Release

      - name: Build the packages
        env:
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: packaging/build-deb.sh

      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --title "myDock ${GITHUB_REF_NAME#v}" --generate-notes
